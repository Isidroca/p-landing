<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <title>Cargando ProVenta...</title>
    <script>
      // GitHub Pages has no rewrite rules. Preserve the requested route and
      // send it to the SPA entry point, where index.html restores the URL.
      var path = window.location.pathname + window.location.search;
      window.location.replace('/?p=' + encodeURIComponent(path));
    </script>
  </head>
  <body></body>
</html>
